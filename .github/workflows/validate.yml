name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists the PR's commits

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Structure and contract validation
        run: python3 scripts/validate_repo.py

      - name: Skill routing check
        run: python3 scripts/check_triggers.py

      - name: Tooling unit tests
        run: python3 -m unittest discover -s scripts/tests -t . -v

      - name: Generated agent adapters are current
        run: python3 scripts/build_adapters.py --check

      - name: Secret and .env hygiene
        run: python3 scripts/check_env.py --strict

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.22.1   # pinned: lint rules change between versions

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
