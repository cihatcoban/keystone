repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: validate-repo
        name: validate keystone repository
        entry: python3 scripts/validate_repo.py
        language: system
        pass_filenames: false
      - id: check-triggers
        name: check skill trigger vocabulary
        entry: python3 scripts/check_triggers.py
        language: system
        pass_filenames: false
      - id: adapters-current
        name: generated agent adapters are current
        entry: python3 scripts/build_adapters.py --check
        language: system
        pass_filenames: false
      - id: env-hygiene
        name: .env and secret hygiene
        entry: python3 scripts/check_env.py --strict
        language: system
        pass_filenames: false
