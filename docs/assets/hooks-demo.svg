<svg xmlns="http://www.w3.org/2000/svg" width="900" height="466" viewBox="0 0 900 466" role="img" aria-labelledby="t d">
<title id="t">Keystone runtime hooks stopping an agent</title>
<desc id="d">Three actions an agent attempts and the verbatim Keystone hook response: lowering a coverage threshold is denied, skipping a test is denied, a force push to main is denied.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px}.c{fill:#e6edf3}.a{fill:#8b949e}.d{fill:#ff7b72;font-weight:700}.q{fill:#e3b341;font-weight:700}.h{fill:#79c0ff}.m{fill:#c9d1d9}</style>
<rect width="900" height="466" rx="10" fill="#0d1117"/>
<rect width="900" height="34" rx="10" fill="#161b22"/><rect y="24" width="900" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="450" y="22" text-anchor="middle" class="a">keystone hooks · strict profile · verbatim output, line-wrapped</text>
<text x="24" y="68"><tspan class="c">agent ▸ Edit CONSTRAINTS.md</tspan><tspan class="a">  | Line coverage | ≥ 80% → ≥ 60% |</tspan></text>
<text x="24" y="90"><tspan class="d">✗ deny</tspan><tspan class="h" dx="12">bar.constraints-lowered</tspan></text>
<text x="48" y="112" class="m">CONSTRAINTS.md loosens the quality bar: 'Line coverage': '≥ 80%' → '≥ 60%'.</text>
<text x="48" y="134" class="m">Lowering a number is a standalone change with its own justification,</text>
<text x="48" y="156" class="m">never part of a feature (CLAUDE.md §4).</text>
<text x="24" y="196"><tspan class="c">agent ▸ Edit tests/test_refund.py</tspan><tspan class="a">  + @pytest.mark.skip(reason="flaky")</tspan></text>
<text x="24" y="218"><tspan class="d">✗ deny</tspan><tspan class="h" dx="12">bar.test-weakened</tspan></text>
<text x="48" y="240" class="m">tests/test_refund.py adds skip/focus markers</text>
<text x="48" y="262" class="m">(`@pytest.mark.skip(reason="flaky")`). A skipped, removed or weakened</text>
<text x="48" y="284" class="m">test converts a failure into silence (CLAUDE.md §4).</text>
<text x="24" y="324"><tspan class="c">agent ▸ Bash</tspan><tspan class="a">  git push --force origin main</tspan></text>
<text x="24" y="346"><tspan class="d">✗ deny</tspan><tspan class="h" dx="12">git.force-push</tspan></text>
<text x="48" y="368" class="m">`git push --force origin main` rewrites or deletes protected branch main.</text>
<text x="48" y="390" class="m">History others have pulled cannot be taken back; this needs a human</text>
<text x="48" y="412" class="m">decision (CLAUDE.md §1.3).</text>
</svg>
